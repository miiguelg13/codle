<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101913" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <title>Codle · retos diarios de programación</title>
    <script>
      // Aplica el tema antes de pintar (evita el parpadeo del tema oscuro al cargar).
      try {
        var t = localStorage.getItem('codle:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var k = localStorage.getItem('codle:skin') === 'classic' ? 'classic' : 'bloc';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.skin = k;
        var c = k === 'classic' ? (t === 'light' ? '#ffffff' : '#12161f') : t === 'light' ? '#e3eddb' : '#101913';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
